            const [expandedEvents, setExpandedEvents] = useState([]);

            const [expandAll, setExpandAll] = useState(false);
            const [currentTime, setCurrentTime] = useState(new Date());
            
            const [showFilters, setShowFilters] = useState(false);
            const [showLinks, setShowLinks] = useState(false);
            const [activeChecklist, setActiveChecklist] = useState(null); 
            const [showNedCheatsheet, setShowNedCheatsheet] = useState(false);
            const [filterClicks, setFilterClicks] = useState({ id: null, count: 0 }); 
            
            const [view, setView] = useState('timeline'); 
            const [directoryTab, setDirectoryTab] = useState('vendors');

            const timelineScrollRef = useRef(null); 
            const activeRef = useRef(null); 

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            const parseEventTime = (timeStr) => {
                const [time, period] = timeStr.split(' ');
                let [hours, minutes] = time.split(':').map(Number);
                if (period === 'PM' && hours !== 12) hours += 12;
                if (period === 'AM' && hours === 12) hours = 0;
                return hours * 60 + minutes; 
            };

            // Calculate auto-scroll based on actual current time 
            const currentMinutes = currentTime.getHours() * 60 + currentTime.getMinutes();
            const effectiveMinutes = currentMinutes; 

            const getEventStatus = (eventTimeStr, nextEventTimeStr) => {
                const eMins = parseEventTime(eventTimeStr);
                const nextMins = nextEventTimeStr ? parseEventTime(nextEventTimeStr) : 1440;
                
                if (effectiveMinutes >= eMins && effectiveMinutes < nextMins) return 'now';
                if (effectiveMinutes >= nextMins) return 'past';
                return 'future';
            };

            const renderDescriptionContent = (desc) => {
                if (!desc) return null;
                if (typeof desc === 'string') return <p className="text-[#F5E6E9] mt-4 leading-relaxed font-light">{desc}</p>;
                if (Array.isArray(desc)) {
                    return (
                        <div className="mt-4 space-y-4 font-light text-[#F5E6E9]">
                            {desc.map((section, idx) => {
                                if (section.type === 'paragraph') return <p key={idx} className="leading-relaxed">{section.text}</p>;
                                if (section.type === 'list') return <div key={idx}>{section.title && <p className="text-sm font-semibold uppercase tracking-wide text-[#E7C0C8] mb-1.5">{section.title}</p>}<ul className="list-none space-y-1.5 pl-1">{section.items.map((line, i) => <li key={i} className="flex items-start gap-2.5"><span className="w-1.5 h-1.5 rounded-full bg-[#D596A4] shrink-0 mt-2"></span><span>{line}</span></li>)}</ul></div>;
                                if (section.type === 'checklist') return <div key={idx} className="space-y-2 bg-[#7A1D31]/30 p-3 rounded-lg border border-[#942B42]/50">{section.items.map((item, i) => <label key={i} className="flex items-center gap-3 cursor-pointer group"><input type="checkbox" className="peer sr-only" /><span className="w-5 h-5 border-2 border-[#D596A4] rounded bg-transparent flex items-center justify-center shrink-0 peer-checked:bg-[#D596A4] peer-checked:border-[#D596A4] transition-colors"><Icons.Check className="w-3.5 h-3.5 text-[#5E1523]" /></span><span className="text-sm group-hover:text-white peer-checked:text-[#D596A4] peer-checked:line-through transition-colors select-none">{item}</span></label>)}</div>;
                                return null;
                            })}
                        </div>
                    );
                }
                return null;
            };

            const filteredEvents = events.filter(event => selectedFilters.includes('all') || event.teams.includes('all') || event.teams.some(team => selectedFilters.includes(team)));

            let currentEventId = null;
            for (let i = 0; i < filteredEvents.length; i++) {
                if (getEventStatus(filteredEvents[i].time, filteredEvents[i+1]?.time) === 'now') { 
                    currentEventId = filteredEvents[i].id; 
                    break; 
                }
            }
            if (!currentEventId && filteredEvents.length > 0) {
                currentEventId = filteredEvents[0].id;
            }

            useEffect(() => {
                if (activeRef.current && view === 'timeline') {
                    setTimeout(() => {
                        activeRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 500);
                }
            }, [view, selectedFilters]);

            const toggleFilter = (filterId) => {
                let clicks = 1;
                if (filterClicks.id === filterId) clicks = filterClicks.count + 1;
                setFilterClicks({ id: filterId, count: clicks });

                if (filterId === 'mc_ned' && clicks >= 2) {
                    setShowNedCheatsheet(true);
                    setFilterClicks({ id: null, count: 0 });
                    return;
                }

                if (CONFIG.checklists[filterId] && clicks >= 3) {
                    setActiveChecklist(filterId);
                    setFilterClicks({ id: null, count: 0 });
                    return; 
                }

                if (filterId === 'all') { 
                    setSelectedFilters(['all']); 
                    setFilterClicks({ id: null, count: 0 });
                } else {
                    setSelectedFilters(prev => {
                        const clean = prev.filter(f => f !== 'all');
                        if (clean.includes(filterId)) { 
                            if ((CONFIG.checklists[filterId] || filterId === 'mc_ned') && clicks >= 2) return prev; 
                            const updated = clean.filter(f => f !== filterId); 
                            return updated.length === 0 ? ['all'] : updated; 
                        } else { 
                            return [...clean, filterId]; 
                        }
                    });
                }
            };

            const toggleEvent = (id) => {
                if (expandAll) return;
                setExpandedEvents(prev => prev.includes(id) ? prev.filter(e => e !== id) : [...prev, id]);
            };
            
            const toggleExpandAll = () => { 
                if (expandAll) { setExpandAll(false); setExpandedEvents([]); } 
                else { setExpandAll(true); setExpandedEvents(filteredEvents.map(e => e.id)); }
            };

            return (
                <div className="overflow-x-hidden w-full relative min-h-screen bg-[#5E1523] text-[#FDFBF7]">
                    {activeChecklist && <ChecklistModal data={CONFIG.checklists[activeChecklist]} onClose={() => setActiveChecklist(null)} />}
                    {showNedCheatsheet && <NedCheatsheetModal onClose={() => setShowNedCheatsheet(false)} />}
                    {showLinks && <HelpfulLinksModal onClose={() => setShowLinks(false)} />}

                    <div className="flex w-[200%] transition-transform duration-500 ease-in-out h-[100dvh]" style={{ transform: `translateX(-${view === 'timeline' ? '0' : '50'}%)` }}>
                        
                        {/* --- VIEW 1: TIMELINE --- */}
                        <div ref={timelineScrollRef} className="w-1/2 shrink-0 relative z-20 h-[100dvh] overflow-y-auto bg-[#5E1523]">
                            
                            <header className="w-full bg-[#FDFBF7] text-[#5E1523] px-4 py-10 text-center select-none flex flex-col items-center justify-center">
                                <h1 className="text-4xl sm:text-5xl font-serif mb-2 text-[#7A1D31]">{CONFIG.coupleNames}</h1>
                                <p className="text-[#942B42] font-light tracking-wide">{CONFIG.displayDate}</p>
                                <p className="text-[#C0687C] font-light text-sm mt-1">{CONFIG.weddingLocation}</p>
                            </header>

                            <div className="sticky top-0 z-50 w-full bg-[#7A1D31]/95 backdrop-blur shadow-md border-b border-[#450D18] transition-all duration-300">
                                <div className="max-w-4xl mx-auto px-4 w-full">
                                    <div className="flex items-center justify-between w-full py-4">
                                        <button onClick={() => setShowFilters(!showFilters)} className="flex-1 flex items-center justify-center gap-2 text-[#F5E6E9] hover:text-white transition-colors">
                                            <Icons.Search className="w-4 h-4" /><span className="font-serif text-sm uppercase tracking-wider">Filters &amp; Roles</span>
                                            {showFilters ? <Icons.ChevronUp className="w-4 h-4" /> : <Icons.ChevronDown className="w-4 h-4" />}
                                        </button>
                                        
                                        <div className="w-px h-6 bg-[#942B42] mx-2"></div>
                                        <button onClick={() => setView('vendors')} className="flex items-center gap-2 text-[#F5E6E9] hover:text-white px-2 transition-colors">
                                            <Icons.User className="w-5 h-5" /><span className="hidden sm:inline font-serif text-sm uppercase tracking-wider">Contacts</span>
                                        </button>

                                        <div className="w-px h-6 bg-[#942B42] mx-2"></div>
                                        <button onClick={() => setShowLinks(true)} className="flex items-center gap-2 text-[#F5E6E9] hover:text-white pl-2">
                                            <Icons.Info className="w-5 h-5" />
                                        </button>
                                    </div>

                                    {showFilters && (
                                        <div className="pb-6 animate-in slide-in-from-top-2 border-t border-[#942B42] pt-4">
                                            <div className="flex flex-wrap gap-2 justify-center">
                                                {CONFIG.filters.map(filter => {
                                                    const isSelected = selectedFilters.includes(filter.id);
                                                    return (
                                                        <button key={filter.id} onClick={() => toggleFilter(filter.id)} className={`px-4 py-2 rounded-full text-sm font-light tracking-wide transition-all border ${isSelected ? 'bg-white text-[#5E1523] border-white shadow-md' : 'bg-transparent text-[#F5E6E9] border-[#942B42] hover:bg-[#942B42]'}`}>
                                                            {filter.label}
                                                        </button>
                                                    );
                                                })}
                                                <div className="w-px h-6 bg-[#942B42] mx-2 mt-1"></div>
                                                <button onClick={toggleExpandAll} className="px-4 py-2 rounded-full text-sm font-light tracking-wide text-white border border-[#D596A4] hover:bg-[#942B42]">{expandAll ? 'Collapse All' : 'Expand All'}</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="w-full relative pb-32">
                                <div className="max-w-3xl mx-auto w-full px-4 pt-8 relative">
                                    <div className="absolute left-[3.5rem] top-8 bottom-0 w-px bg-[#942B42] z-0"></div>
                                    
                                    <div className="space-y-6">
                                        {filteredEvents.map((event, index) => {
                                            const isExpanded = expandAll || expandedEvents.includes(event.id);
                                            const status = getEventStatus(event.time, filteredEvents[index+1]?.time);
                                            const isPast = status === 'past';
                                            const isNow = status === 'now';
                                            const isFirstActive = event.id === currentEventId;

                                            return (
                                                <div key={event.id} ref={isFirstActive ? activeRef : null} className={`relative z-10 transition-all duration-300 ease-in-out ${isPast ? 'opacity-50' : ''}`}>
                                                    
                                                    {isExpanded ? (
                                                        <div className="flex flex-col w-full py-2 fade-in-up">
                                                            <div className="flex justify-center mb-4">
                                                                <span className={`time-pill whitespace-nowrap px-3 py-1.5 rounded-lg text-sm font-medium shadow-sm ${isPast ? 'bg-[#7A1D31] text-[#E7C0C8]' : 'bg-[#FDFBF7] text-[#5E1523]'}`}>{event.time}</span>
                                                            </div>
                                                            <div className="bg-[#7A1D31] rounded-xl shadow-xl border border-[#942B42] overflow-hidden w-full">
                                                                <button onClick={() => toggleEvent(event.id)} className="w-full px-6 py-5 text-left flex items-center justify-between outline-none">
                                                                    <div className="flex-1 pr-4">
                                                                        <h3 className="text-xl font-serif mb-2 text-white">{event.title}</h3>
                                                                        <div className="flex flex-col gap-2 text-[#E7C0C8]">
                                                                            <span className="inline-flex items-center gap-1.5 text-sm font-light"><Icons.MapPin className="w-3.5 h-3.5" />{event.location}</span>
                                                                            {event.responsible && <span className="flex items-center gap-1.5 text-xs font-medium uppercase tracking-wide"><Icons.User className="w-3.5 h-3.5" />{event.responsible.join(', ')}</span>}
                                                                        </div>
                                                                    </div>
                                                                    <Icons.ChevronUp className="w-5 h-5 text-[#D596A4] shrink-0" />
                                                                </button>
                                                                <div className="px-6 pb-6 border-t border-[#942B42]">
                                                                    {renderDescriptionContent(event.description)}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="flex items-start w-full relative pl-[5.75rem] sm:pl-[7.5rem]">
                                                            <div className="absolute left-0 w-[5.25rem] sm:w-28 flex justify-center mt-1">
                                                                <span className={`time-pill whitespace-nowrap px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium shadow-sm transition-all ${isPast ? 'bg-[#7A1D31] text-[#E7C0C8]' : isNow ? 'bg-[#FDFBF7] text-[#5E1523] ring-2 ring-[#D596A4]' : 'bg-[#FDFBF7] text-[#5E1523]'}`}>{event.time}</span>
                                                            </div>
                                                            <button onClick={() => toggleEvent(event.id)} className={`bg-[#7A1D31] rounded-xl border border-[#942B42] transition-all duration-300 ease-in-out w-full shadow-sm hover:bg-[#942B42] px-6 py-5 text-left flex items-center justify-between outline-none`}>
                                                                <div className="flex-1 pr-2 sm:pr-4 min-w-0">
                                                                    <h3 className="text-lg sm:text-xl font-serif mb-2 text-white">{event.title}</h3>
                                                                    <span className="inline-flex items-start gap-1.5 text-sm text-[#E7C0C8] font-light"><Icons.MapPin className="w-3.5 h-3.5 shrink-0 mt-0.5" /><span className="break-words">{event.location}</span></span>
                                                                </div>
                                                                <Icons.ChevronDown className="w-5 h-5 text-[#D596A4] shrink-0" />
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                <footer className="mt-8 border-t border-[#7A1D31] w-full max-w-4xl mx-auto">
                                    <div className="px-4 py-12 text-center">
                                        <Icons.Heart className="w-6 h-6 mx-auto mb-4 text-[#D596A4]" />
                                        <p className="text-[#E7C0C8] font-light text-sm">{CONFIG.footerMessage}</p>
                                        <p className="text-[#D596A4] font-serif italic text-sm mt-4">{CONFIG.footerSignoff}</p>
                                    </div>
                                </footer>
                            </div>
                        </div>

                        {/* --- VIEW 2: DIRECTORY (RIGHT) --- */}
                        <div className="w-1/2 shrink-0 h-[100dvh] overflow-y-auto relative bg-[#5E1523] flex flex-col">
                            <div className="bg-[#7A1D31]/95 backdrop-blur border-b border-[#450D18] sticky top-0 z-50 shrink-0">
                                <div className="max-w-3xl mx-auto px-6 py-6 pt-4 text-center select-none relative">
                                    <button onClick={() => setView('timeline')} className="absolute left-6 top-5 p-2 text-[#D596A4] hover:text-white">
                                        <Icons.ArrowLeft className="w-6 h-6" />
                                    </button>
                                    <h2 className="text-3xl font-serif mb-1 text-white">Directory</h2>
                                    <p className="text-[#E7C0C8] text-sm font-light">Key contacts for the big day.</p>
                                </div>
                                <div className="max-w-3xl mx-auto flex justify-center pb-0 space-x-2">
                                    <button onClick={() => setDirectoryTab('vendors')} className={`px-4 py-3 font-serif text-sm transition-colors ${directoryTab === 'vendors' ? 'border-b-2 border-white text-white' : 'text-[#D596A4] hover:text-[#F5E6E9]'}`}>Vendors</button>
                                    <button onClick={() => setDirectoryTab('responsible')} className={`px-4 py-3 font-serif text-sm transition-colors ${directoryTab === 'responsible' ? 'border-b-2 border-white text-white' : 'text-[#D596A4] hover:text-[#F5E6E9]'}`}>Bridal Party</button>
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto w-full">
                                <div className="max-w-3xl mx-auto w-full px-4 py-8">
                                    {directoryTab === 'responsible' && (
                                        <div className="bg-[#7A1D31] rounded-2xl shadow-sm border border-[#942B42] overflow-hidden">
                                            <div className="divide-y divide-[#942B42]">
                                                {responsiblePeople.map((person, idx) => (
                                                    <div key={idx} className="p-5 flex items-center justify-between hover:bg-[#942B42] transition-colors">
                                                        <div>
                                                            <p className="text-xs font-bold uppercase tracking-widest text-[#D596A4] mb-1">{person.role}</p>
                                                            <h3 className="text-base font-medium text-white">{person.name}</h3>
                                                        </div>
                                                        <a href={`tel:${person.contact}`} className="flex items-center justify-center gap-2 bg-white text-[#5E1523] w-10 h-10 rounded-full hover:bg-[#F5E6E9] transition-colors"><Icons.Phone className="w-4 h-4" /></a>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {directoryTab === 'vendors' && (
                                        <div className="bg-[#7A1D31] rounded-2xl shadow-sm border border-[#942B42] overflow-hidden">
                                            <div className="divide-y divide-[#942B42]">
                                                {vendors.map((vendor, idx) => (
                                                    <div key={idx} className="p-5 flex flex-col sm:flex-row gap-4 sm:items-center justify-between hover:bg-[#942B42] transition-colors">
                                                        <div>
                                                            <p className="text-xs font-bold uppercase tracking-widest text-[#D596A4] mb-1">{vendor.role}</p>
                                                            <h3 className="text-base font-medium text-white">{vendor.name}</h3>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            {vendor.email && (
                                                                <a href={`mailto:${vendor.email}`} className="flex items-center justify-center gap-2 border border-[#D596A4] text-white w-10 h-10 rounded-full hover:bg-[#942B42] transition-colors"><Icons.Mail className="w-4 h-4" /></a>
                                                            )}
                                                            {vendor.contact && vendor.contact !== 'TBA' ? (
                                                                <a href={`tel:${vendor.contact}`} className="flex items-center gap-2 bg-white text-[#5E1523] px-4 h-10 rounded-full text-sm font-medium hover:bg-[#F5E6E9] transition-colors"><Icons.Phone className="w-4 h-4" /><span>Call</span></a>
                                                            ) : (
                                                                <span className="text-xs text-[#D596A4] font-mono bg-[#450D18] px-3 h-10 rounded-full flex items-center">TBA</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    <div className="mt-12 text-center pb-12"><button onClick={() => setView('timeline')} className="text-[#D596A4] hover:text-white text-sm flex items-center justify-center gap-2 mx-auto transition-colors"><Icons.ArrowLeft className="w-4 h-4" />Back to Timeline</button></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            useEffect(() => { if (localStorage.getItem('weddingAuth_' + CONFIG.pinCode) === 'true') setIsAuthenticated(true); }, []);
            if (!isAuthenticated) return <PinScreen onAccess={() => setIsAuthenticated(true)} />;
            return <div className="animate-in fade-in zoom-in-95 duration-500 ease-out"><WeddingTimeline /></div>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
