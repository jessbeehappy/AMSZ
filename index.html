                const searchTextMatches = (text) => text.toLowerCase().includes(searchQuery.toLowerCase());
                let descMatch = false;
                if (typeof event.description === 'string') descMatch = searchTextMatches(event.description);
                else if (Array.isArray(event.description)) descMatch = event.description.some(item => typeof item === 'string' ? searchTextMatches(item) : (item.text && searchTextMatches(item.text)) || (item.items && item.items.some(i => searchTextMatches(i))));
                const searchMatch = searchQuery === '' || searchTextMatches(event.title) || descMatch || searchTextMatches(event.location) || searchTextMatches(event.time) || (event.responsible && event.responsible.some(r => searchTextMatches(r)));
                return teamMatch && searchMatch;
            });

            const toggleFilter = (filterId) => {
                let clicks = 1;
                if (filterClicks.id === filterId) {
                    clicks = filterClicks.count + 1;
                }
                setFilterClicks({ id: filterId, count: clicks });

                if (CONFIG.checklists[filterId] && clicks >= 3) {
                    setActiveChecklist(filterId);
                    setFilterClicks({ id: null, count: 0 }); 
                    return; 
                }

                if (filterId === 'all') { 
                    setSelectedFilters(['all']); 
                    setFilterClicks({ id: null, count: 0 });
                } else {
                    setSelectedFilters(prev => {
                        const clean = prev.filter(f => f !== 'all');
                        const isSelected = clean.includes(filterId);
                        if (isSelected) { 
                            if (CONFIG.checklists[filterId] && clicks === 2) return prev; 
                            const updated = clean.filter(f => f !== filterId); 
                            return updated.length === 0 ? ['all'] : updated; 
                        } else { 
                            return [...clean, filterId]; 
                        }
                    });
                }
            };

            const toggleEvent = (id) => {
                if (expandAll) return;
                setExpandedEvents(prev => prev.includes(id) ? prev.filter(e => e !== id) : [...prev, id]);
            };
            
            const toggleExpandAll = () => { 
                if (expandAll) { setExpandAll(false); setExpandedEvents([]); } 
                else { setExpandAll(true); setExpandedEvents(filteredEvents.map(e => e.id)); }
            };

            const translation = view === 'timeline' ? '0' : '50';

            return (
                <div className={`overflow-x-hidden w-full relative min-h-screen ${activeTheme.bg}`}>
                    {activeChecklist && <ChecklistModal data={CONFIG.checklists[activeChecklist]} onClose={() => setActiveChecklist(null)} />}
                    {showLinks && <HelpfulLinksModal onClose={() => setShowLinks(false)} />}

                    <div className="hidden md:block fixed top-1/2 left-8 z-50 transform -translate-y-1/2">
                        {view === 'vendors' && <button onClick={() => setView('timeline')} className="bg-burgundy-800 shadow-lg p-4 rounded-full hover:bg-burgundy-700 transition-all hover:scale-110 border border-burgundy-600"><Icons.ArrowLeft className="w-6 h-6 text-cream" /></button>}
                    </div>
                    <div className="hidden md:block fixed top-1/2 right-8 z-50 transform -translate-y-1/2">
                        {view === 'timeline' && <button onClick={() => setView('vendors')} className="bg-burgundy-800 shadow-lg p-4 rounded-full hover:bg-burgundy-700 transition-all hover:scale-110 border border-burgundy-600"><Icons.ArrowRight className="w-6 h-6 text-cream" /></button>}
                    </div>

                    <div className={`flex w-[200%] transition-transform duration-500 ease-in-out h-[100dvh]`} style={{ transform: `translateX(-${translation}%)` }}>
                        
                        {/* --- VIEW 1: TIMELINE --- */}
                        <div ref={timelineScrollRef} onScroll={handleTimelineScroll} className={`w-1/2 shrink-0 relative z-20 h-[100dvh] overflow-y-auto ${activeTheme.bg}`}>
                            
                            <header className="w-full bg-burgundy-950 px-4 py-8 text-center select-none flex flex-col items-center justify-center border-b border-burgundy-800" onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
                                <div className="w-full flex justify-center pb-6 md:hidden"><div className="w-12 h-1.5 bg-burgundy-700 rounded-full"></div></div>
                                <h1 className={`text-4xl font-serif mb-2 text-cream`}>{CONFIG.coupleNames}</h1>
                                <p className="text-burgundy-200 font-light tracking-wide">{CONFIG.displayDate}</p>
                                <p className="text-burgundy-300 font-light text-sm mt-1">{CONFIG.weddingLocation}</p>
                            </header>

                            <div className="sticky top-0 z-50 w-full bg-burgundy-900/95 backdrop-blur shadow-sm border-b border-burgundy-800 transition-all duration-300" onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
                                <div className="max-w-4xl mx-auto px-4 w-full">
                                    <div className="flex items-center justify-between w-full py-4">
                                        <button onClick={scrollToTop} className={`pr-4 pl-2 text-burgundy-300 hover:text-cream transition-opacity duration-300 md:hidden ${isScrolled ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                                            <Icons.ArrowUp className="w-5 h-5" />
                                        </button>

                                        <button onClick={() => { if(isScrolled) scrollToTop(); setShowFilters(!showFilters); }} className={`flex-1 flex items-center justify-center gap-2 text-cream/80 hover:text-cream transition-colors`}>
                                            <Icons.Search className="w-4 h-4" /><span className="font-serif text-sm uppercase tracking-wider">Search & Filters</span>
                                            {showFilters ? <Icons.ChevronUp className="w-4 h-4" /> : <Icons.ChevronDown className="w-4 h-4" />}
                                        </button>
                                        
                                        <div className="w-px h-6 bg-burgundy-700 mx-2"></div>
                                        <button onClick={() => setView('vendors')} className={`flex items-center gap-2 text-cream/80 hover:text-cream px-2 transition-colors`}>
                                            <Icons.User className="w-5 h-5" /><span className="hidden sm:inline font-serif text-sm uppercase tracking-wider">Contacts</span>
                                        </button>
                                        <div className="w-px h-6 bg-burgundy-700 mx-2"></div>
                                        <button onClick={() => setShowLinks(true)} className={`flex items-center gap-2 text-cream/80 hover:text-cream pl-2`}>
                                            <Icons.Info className="w-5 h-5" />
                                        </button>
                                    </div>

                                    {showFilters && (
                                        <div className="pb-6 animate-in slide-in-from-top-2 border-t border-burgundy-800 pt-4">
                                            <div className="mb-4">
                                                <input type="text" placeholder="Search events, locations..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full px-4 py-2 rounded-lg border border-burgundy-700 focus:border-cream outline-none bg-burgundy-950 text-cream placeholder-burgundy-400"/>
                                            </div>
                                            <div className="flex flex-wrap gap-2 justify-center">
                                                {CONFIG.filters.map(filter => {
                                                    const isSelected = selectedFilters.includes(filter.id);
                                                    const selectedClass = activeTheme.accent;
                                                    return (
                                                        <button key={filter.id} onClick={() => toggleFilter(filter.id)} className={`px-4 py-2 rounded-full text-sm font-medium tracking-wide transition-all flex items-center gap-1.5 ${isSelected ? selectedClass : `bg-burgundy-800 text-cream hover:bg-burgundy-700`}`}>
                                                            {filter.label}
                                                        </button>
                                                    );
                                                })}
                                                <div className="w-px h-6 bg-burgundy-700 mx-2 mt-1"></div>
                                                <button onClick={toggleExpandAll} className={`px-4 py-2 rounded-full text-sm font-medium tracking-wide bg-transparent border border-burgundy-500 text-cream hover:bg-burgundy-800`}>{expandAll ? 'Collapse All' : 'Expand All'}</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="w-full relative pb-32">
                                <div className="max-w-3xl mx-auto w-full px-4 pt-4 relative">
                                    <div className="absolute left-[3.5rem] top-4 bottom-0 w-px bg-burgundy-700 z-0"></div>
                                    
                                    <div className="space-y-6">
                                        {filteredEvents.map((event, index) => {
                                            const isExpanded = expandAll || expandedEvents.includes(event.id);
                                            
                                            return (
                                                <div key={event.id} className={`relative z-10 transition-all duration-300 ease-in-out`}>
                                                    {isExpanded ? (
                                                        <div className="flex flex-col w-full py-2 fade-in-up">
                                                            <div className="flex justify-center mb-4">
                                                                <span className={`time-pill whitespace-nowrap px-3 py-1.5 rounded-lg text-sm font-medium shadow-sm bg-cream text-burgundy-900`}>{event.time}</span>
                                                            </div>
                                                            <div className="bg-burgundy-800 rounded-xl shadow-xl border border-burgundy-600 overflow-hidden w-full">
                                                                <button onClick={() => toggleEvent(event.id)} className="w-full px-6 py-5 text-left flex items-center justify-between bg-transparent outline-none">
                                                                    <div className="flex-1 pr-4">
                                                                        <h3 className={`text-xl font-serif mb-2 text-cream`}>{event.title}</h3>
                                                                        <div className="flex flex-col gap-2">
                                                                            <span className={`inline-flex items-center gap-1.5 text-sm text-burgundy-200 font-light`}>
                                                                                <Icons.MapPin className="w-3.5 h-3.5" />
                                                                                {event.location}
                                                                            </span>
                                                                            {event.responsible && (
                                                                                <div className="flex items-center gap-1.5 text-xs text-burgundy-300 font-medium uppercase tracking-wide">
                                                                                    <Icons.User className="w-3.5 h-3.5" />
                                                                                    {event.responsible.join(', ')}
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    </div>
                                                                    <Icons.ChevronUp className="w-5 h-5 text-burgundy-400 shrink-0" />
                                                                </button>
                                                                <div className="px-6 pb-6 border-t border-burgundy-700">
                                                                    {renderDescriptionContent(event.description)}
                                                                    <div className="mt-5 flex flex-wrap gap-2">{event.teams.map(team => (<span key={team} className={`px-3 py-1 bg-burgundy-900 text-burgundy-100 text-xs rounded-full border border-burgundy-700`}>{CONFIG.filters.find(f => f.id === team)?.label || team}</span>))}</div>
                                                                    {event.links && event.links.length > 0 && (
                                                                        <div className="mt-4 space-y-2">
                                                                            {event.links.map((link, idx) => (
                                                                                <a key={idx} href={link.url} target="_blank" rel="noopener noreferrer" className={`flex items-center gap-2 text-cream text-sm underline-offset-4 hover:underline transition-colors`}><Icons.ExternalLink className="w-4 h-4" />{link.text}</a>
                                                                            ))}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="flex items-start w-full relative pl-[5.75rem] sm:pl-[7.5rem]">
                                                            <div className="absolute left-0 w-[5.25rem] sm:w-28 flex justify-center mt-1">
                                                                <span className={`time-pill whitespace-nowrap px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium shadow-sm transition-all bg-burgundy-800 border border-burgundy-600 text-cream`}>{event.time}</span>
                                                            </div>
                                                            <button onClick={() => toggleEvent(event.id)} className={`bg-burgundy-800 rounded-xl border border-burgundy-600 transition-all duration-300 ease-in-out w-full shadow-sm hover:bg-burgundy-700 px-6 py-5 text-left flex items-center justify-between outline-none`}>
                                                                <div className="flex-1 pr-2 sm:pr-4 min-w-0">
                                                                    <h3 className={`text-lg sm:text-xl font-serif mb-2 text-cream`}>{event.title}</h3>
                                                                    <div className="flex flex-col gap-2">
                                                                        <span className={`inline-flex items-start gap-1.5 text-sm text-burgundy-200 font-light`}>
                                                                            <Icons.MapPin className="w-3.5 h-3.5 shrink-0 mt-0.5" />
                                                                            <span className="break-words">{event.location}</span>
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                                <Icons.ChevronDown className="w-5 h-5 text-burgundy-400 shrink-0" />
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                <footer className="mt-8 border-t border-burgundy-800 w-full max-w-4xl mx-auto">
                                    <div className="px-4 py-12 text-center">
                                        <p className="text-burgundy-300 font-light text-sm">{CONFIG.footerMessage}</p>
                                        <p className="text-burgundy-400 font-serif italic text-sm mt-4">{CONFIG.footerSignoff}</p>
                                    </div>
                                </footer>
                            </div>
                        </div>

                        {/* --- VIEW 2: DIRECTORY (RIGHT) --- */}
                        <div className={`w-1/2 shrink-0 h-[100dvh] overflow-y-auto relative bg-burgundy-950 flex flex-col`}>
                            <div className="bg-burgundy-900/95 backdrop-blur border-b border-burgundy-800 sticky top-0 z-50 shrink-0" onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
                                <div className="w-full flex justify-center pt-3 md:hidden"><div className="w-12 h-1.5 bg-burgundy-700 rounded-full"></div></div>
                                <div className="max-w-3xl mx-auto px-6 py-6 pt-4 text-center select-none relative">
                                    <button onClick={() => setView('timeline')} className="absolute left-6 top-5 p-2 text-burgundy-300 hover:text-cream md:hidden">
                                        <Icons.ArrowLeft className="w-6 h-6" />
                                    </button>
                                    <h2 className={`text-3xl font-serif mb-1 text-cream`}>Directory</h2>
                                    <p className="text-burgundy-200 text-sm font-light">Key contacts for the big day.</p>
                                </div>
                                <div className="max-w-3xl mx-auto flex justify-center pb-0 space-x-2">
                                    <button onClick={() => setDirectoryTab('vendors')} className={`px-4 py-3 font-serif text-sm transition-colors ${directoryTab === 'vendors' ? `border-b-2 border-cream text-cream` : 'text-burgundy-400 hover:text-burgundy-200'}`}>Vendors</button>
                                    <button onClick={() => setDirectoryTab('responsible')} className={`px-4 py-3 font-serif text-sm transition-colors ${directoryTab === 'responsible' ? `border-b-2 border-cream text-cream` : 'text-burgundy-400 hover:text-burgundy-200'}`}>Bridal Party</button>
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto w-full">
                                <div className="max-w-3xl mx-auto w-full px-4 py-8">
                                    {directoryTab === 'responsible' && (
                                        <div className="bg-burgundy-900 rounded-2xl shadow-sm border border-burgundy-700 overflow-hidden animate-in fade-in zoom-in-95 duration-300">
                                            <div className="divide-y divide-burgundy-800">
                                                {responsiblePeople.map((person, idx) => (
                                                    <div key={idx} className="p-5 flex items-center justify-between hover:bg-burgundy-800 transition-colors">
                                                        <div>
                                                            <p className="text-xs font-bold uppercase tracking-widest text-burgundy-400 mb-1">{person.role}</p>
                                                            <h3 className={`text-base font-medium text-cream`}>{person.name}</h3>
                                                        </div>
                                                        <a href={`tel:${person.contact}`} className={`flex items-center justify-center gap-2 bg-cream text-burgundy-900 w-10 h-10 rounded-full hover:opacity-90 transition-colors`}><Icons.Phone className="w-4 h-4" /></a>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {directoryTab === 'vendors' && (
                                        <div className="bg-burgundy-900 rounded-2xl shadow-sm border border-burgundy-700 overflow-hidden animate-in fade-in zoom-in-95 duration-300">
                                            <div className="divide-y divide-burgundy-800">
                                                {vendors.map((vendor, idx) => (
                                                    <div key={idx} className="p-5 flex flex-col sm:flex-row gap-4 sm:items-center justify-between hover:bg-burgundy-800 transition-colors">
                                                        <div>
                                                            <p className="text-xs font-bold uppercase tracking-widest text-burgundy-400 mb-1">{vendor.role}</p>
                                                            <h3 className={`text-base font-medium text-cream`}>{vendor.name}</h3>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            {vendor.email && (
                                                                <a href={`mailto:${vendor.email}`} className={`flex items-center justify-center gap-2 border border-burgundy-500 text-cream w-10 h-10 rounded-full hover:bg-burgundy-700 transition-colors`}><Icons.Mail className="w-4 h-4" /></a>
                                                            )}
                                                            {vendor.contact && vendor.contact !== 'TBA' && vendor.contact !== '' ? (
                                                                <a href={`tel:${vendor.contact.replace(/\s+/g, '')}`} className={`flex items-center gap-2 bg-cream text-burgundy-900 px-4 h-10 rounded-full text-sm font-medium hover:opacity-90 transition-colors`}><Icons.Phone className="w-4 h-4" /><span>Call</span></a>
                                                            ) : (
                                                                <span className="text-xs text-burgundy-400 font-mono bg-burgundy-950 px-3 h-10 rounded-full flex items-center">TBA</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    <div className="mt-12 text-center pb-12"><button onClick={() => setView('timeline')} className="text-burgundy-400 hover:text-cream text-sm flex items-center justify-center gap-2 mx-auto transition-colors"><Icons.ArrowLeft className="w-4 h-4" />Back to Timeline</button></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            useEffect(() => {
                if (localStorage.getItem('weddingAuth_' + CONFIG.pinCode) === 'true') {
                    setIsAuthenticated(true);
                }
            }, []);

            if (!isAuthenticated) return <PinScreen onAccess={() => setIsAuthenticated(true)} />;
            return <div className="animate-in fade-in zoom-in-95 duration-500 ease-out"><WeddingTimeline /></div>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
